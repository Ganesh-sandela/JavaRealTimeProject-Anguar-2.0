

<div class="chrome-error">

  <div class="error-icon">
    <div class="sad-face">
      <span class="eye left-eye"></span>
      <span class="eye right-eye"></span>
      <span class="mouth"></span>
    </div>
  </div>

  <div class="error-content">

    <h1>This page isn’t working</h1>

    <p>
      The page you are trying to access is currently unavailable.
    </p>

    <p class="error-code">
      <strong>HTTP ERROR {{code}}</strong>
    </p>

    <div class="buttons">

      <button class="reload-btn" (click)="reloadPage()">
        Reload
      </button>

      <button class="details-btn" (click)="goHome()">
        Go to Home
      </button>

    </div>

  </div>

</div>
